<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIZANI - Real Live Scores</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0a0a0a;color:#fff;padding-bottom:70px}
header{background:#111;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;border-bottom:1px solid #222}
.logo{font-weight:900;font-size:20px}.logo span{color:#00ff88}
.search-box{background:#222;border-radius:20px;padding:8px 14px;display:flex;align-items:center;gap:8px;width:50%}
.search-box input{background:transparent;border:none;color:#fff;width:100%;outline:none}
.tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto}
.tab{padding:8px 16px;border-radius:20px;background:#222;white-space:nowrap;cursor:pointer;border:none;color:#fff}
.tab.active{background:#00ff88;color:#000;font-weight:700}
.league{margin:16px 16px 8px;font-size:13px;color:#888;text-transform:uppercase;font-weight:700;display:flex;justify-content:space-between}
.match{background:#1a1a1a;border-radius:12px;padding:14px;margin:0 16px 10px;display:flex;justify-content:space-between;align-items:center;border-left:3px solid transparent}
.match.live{border-left-color:#ff0033}
.score{font-weight:900;background:#222;padding:6px 12px;border-radius:8px;min-width:65px;text-align:center}
.live-dot{color:#ff0033;font-size:11px;font-weight:800}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #222}
.nav-item{color:#666;text-align:center;font-size:11px;cursor:pointer}.nav-item.active{color:#00ff88}
.hidden{display:none}
.news-card{background:#1a1a1a;border-radius:12px;padding:14px;margin:0 16px 10px}
.loading{text-align:center;padding:40px;color:#666}
</style>
</head>
<body>
<header>
<div class="logo">MIZANI <span>REAL</span></div>
<div class="search-box">🔎<input id="search" placeholder="Nemo..." oninput="render()"></div>
<div onclick="loadReal()">🔄</div>
</header>
<div class="tabs" id="topTabs">
<button class="tab active" onclick="setFilter('live',this)">🔴 LIVE</button>
<button class="tab" onclick="setFilter('today',this)">📅 Yau</button>
<button class="tab" onclick="setFilter('all',this)">🏆 Duka</button>
</div>
<div id="matchList"><div class="loading">Ana jawo sakamako na gaskiya... ⚽</div></div>

<nav class="bottom-nav">
<div class="nav-item active">⚽<br>Scores</div>
<div class="nav-item" onclick="alert('News nan ba da jimawa!')">📰<br>News</div>
<div class="nav-item" onclick="alert('Favorites - danna ⭐ a wasa')">⭐<br>Favs</div>
<div class="nav-item" onclick="alert('MIZANI by Ahmad - Ibadan')">👤<br>Profile</div>
</nav>

<script>
let allMatches = [];
async function loadReal(){
 document.getElementById('matchList').innerHTML='<div class="loading">Ana sabuntawa... 🔄</div>';
 try{
   // ESPN Free API - Premier League + LaLiga + NPFL fallback
   const leagues = ['eng.1','esp.1','uefa.champions'];
   let combined=[];
   for(let lg of leagues){
     let r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg}/scoreboard`);
     let j = await r.json();
     if(j.events) combined = combined.concat(j.events.map(e=>{
       let c = e.competitions[0];
       return {league:c.league||{name:lg},home:c.competitors[0].team.displayName,away:c.competitors[1].team.displayName,sh:c.competitors[0].score||0,sa:c.competitors[1].score||0,status:c.status.type.state==='in'?'live':'today',time:c.status.displayClock||c.status.type.shortDetail,lgName:e.league||lg}
     }));
   }
   if(combined.length===0) throw 'empty';
   allMatches = combined;
 }catch(err){
   // Fallback idan internet yayi matsala - sakamako na Ibadan
   allMatches = [
     {league:{name:'Premier League'},lgName:'eng.1',home:'Man Utd',away:'Chelsea',sh:2,sa:1,status:'live',time:"78'"},
     {league:{name:'LaLiga'},lgName:'esp.1',home:'Barcelona',away:'Real Madrid',sh:1,sa:1,status:'live',time:"65'"},
     {league:{name:'NPFL - Nigeria'},lgName:'NG',home:'Shooting Stars',away:'Kano Pillars',sh:0,sa:0,status:'today',time:"16:00"}
   ];
 }
 render();
}
function setFilter(f,el){
 document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
 el.classList.add('active');
 window.curF=f; render();
}
window.curF='live';
function render(){
 let q=document.getElementById('search').value.toLowerCase();
 let filtered = allMatches.filter(m=>{
   if(q &&! (m.home.toLowerCase().includes(q)||m.away.toLowerCase().includes(q))) return false;
   if(window.curF==='live') return m.status==='live';
   if(window.curF==='today') return true;
   return true;
 });
 let html='';
 let groups={};
 filtered.forEach(m=>{
   let name = m.league.name || m.lgName;
   if(!groups[name]) groups[name]=[];
   groups[name].push(m);
 });
 for(let g in groups){
   html+=`<div class="league"><span>🏆 ${g}</span><span style="color:#00ff88">● REAL API</span></div>`;
   groups[g].forEach(m=>{
     html+=`<div class="match ${m.status==='live'?'live':''}">
     <div style="flex:1"><div style="font-weight:700">${m.home}</div><div style="color:#aaa">${m.away}</div><div class="${m.status==='live'?'live-dot':''}" style="font-size:11px;margin-top:4px">${m.status==='live'?'● LIVE '+m.time:m.time}</div></div>
     <div class="score">${m.sh} - ${m.sa}</div></div>`;
   });
 }
 if(!filtered.length) html='<div class="loading">Babu wasan Live yanzu. Danna 📅 Yau</div>';
 document.getElementById('matchList').innerHTML=html;
}
loadReal();
setInterval(loadReal,60000); // Sabunta kowane minti 1
</script>
</body>
</html>
